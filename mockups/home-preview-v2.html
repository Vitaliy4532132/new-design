<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TheFurryDev — превью v2 (spark studios style)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06070a;
    --surface:#12151c;
    --surface-hover:#181c26;
    --border:#1f2430;
    --border-light:#2a3040;
    --accent-blue:#4F8EFF;
    --accent-purple:#7B5FFF;
    --accent-gradient:linear-gradient(135deg,#4F8EFF,#7B5FFF);
    --text:#E8EAED;
    --text-muted:#8B92A5;
    --text-dim:#5C6470;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  h1,h2,h3{font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:-0.02em;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;position:relative;z-index:2;}
  .grad-text{background:var(--accent-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;}

  /* ===== NAV ===== */
  nav{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:28px 40px;z-index:10;}
  .logo{font-family:'Manrope',sans-serif;font-weight:800;font-size:18px;letter-spacing:-0.01em;}
  .logo span{color:var(--accent-blue);}
  .navlinks{display:flex;gap:32px;font-size:14px;color:var(--text-muted);}

  /* ===== HERO (swirl) ===== */
  .hero{position:relative;height:100vh;min-height:680px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;}
  .swirl{position:absolute;inset:0;z-index:0;}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;mix-blend-mode:screen;}
  .blob1{width:520px;height:520px;background:radial-gradient(circle,var(--accent-blue),transparent 70%);top:-120px;left:-80px;animation:float1 14s ease-in-out infinite;}
  .blob2{width:460px;height:460px;background:radial-gradient(circle,var(--accent-purple),transparent 70%);bottom:-140px;right:-60px;animation:float2 16s ease-in-out infinite;}
  .blob3{width:340px;height:340px;background:radial-gradient(circle,#2a6bff,transparent 70%);top:30%;right:18%;animation:float3 12s ease-in-out infinite;}
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,40px)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-30px)}}
  @keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,50px) scale(1.15)}}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,var(--bg) 88%);z-index:1;}
  .hero-content{position:relative;z-index:2;}
  .hero h1{font-size:60px;line-height:1.1;max-width:820px;}
  .hero-ctas{display:flex;gap:14px;justify-content:center;margin-top:36px;}
  .btn-primary{background:var(--accent-gradient);color:#fff;border:none;font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;padding:15px 28px;border-radius:10px;cursor:pointer;box-shadow:0 8px 24px rgba(79,142,255,0.3);}
  .btn-secondary{background:rgba(255,255,255,0.05);color:var(--text);border:1px solid var(--border-light);font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;padding:15px 28px;border-radius:10px;cursor:pointer;backdrop-filter:blur(6px);}
  .scroll-hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;font-size:13px;color:var(--text-dim);z-index:2;}
  .mouse{width:22px;height:34px;border:1px solid var(--text-dim);border-radius:12px;display:flex;justify-content:center;padding-top:6px;}
  .mouse i{width:3px;height:6px;background:var(--text-dim);border-radius:2px;animation:scrolldot 1.6s ease-in-out infinite;}
  @keyframes scrolldot{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(10px)}}
  .hint-line{width:80px;height:1px;background:var(--border-light);}

  /* ===== ARC GALLERY ===== */
  .arc-section{position:relative;padding:60px 0 40px;text-align:center;}
  .pill{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent-blue);background:rgba(79,142,255,0.08);border:1px solid rgba(79,142,255,0.25);padding:7px 16px;border-radius:100px;margin-bottom:28px;}
  .arc-section h2{font-size:42px;max-width:560px;margin:0 auto 32px;line-height:1.15;}
  .arc-wrap{position:relative;height:430px;margin-top:10px;}
  .arc-card{
    position:absolute;top:0;left:50%;width:108px;height:108px;border-radius:22px;
    border:1px solid var(--border-light);box-shadow:0 16px 30px rgba(0,0,0,0.45);
    transition:transform .25s ease;
  }
  .arc-card:hover{transform:translateY(-10px) scale(1.04) !important;}
</style>
</head>
<body>

<nav>
  <div class="logo">Furry<span>Dev</span></div>
  <div class="navlinks"><span>Услуги</span><span>Портфолио</span><span>Отзывы</span><span>FAQ</span></div>
</nav>

<section class="hero">
  <div class="swirl">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>
  <div class="vignette"></div>
  <div class="hero-content">
    <h1>Студия для тех, кто строит свой <span class="grad-text">майнкрафт</span>-сервер.</h1>
    <div class="hero-ctas">
      <button class="btn-primary">Оставить заявку</button>
      <button class="btn-secondary">Смотреть портфолио</button>
    </div>
  </div>
  <div class="scroll-hint">
    <span>Прокрути вниз</span>
    <div class="mouse"><i></i></div>
    <span>чтобы увидеть проекты</span>
  </div>
</section>

<section class="arc-section">
  <div class="wrap" style="position:static;">
    <div class="pill">⚡ Наши работы</div>
    <h2>Сборки и сервера, которые <span class="grad-text">впечатляют</span>.</h2>
    <div class="arc-wrap" id="arc"></div>
    <button class="btn-primary" style="margin-top:8px;">Начать проект</button>
  </div>
</section>

<script>
  var colors = [
    'linear-gradient(135deg,#1a1c2e,#3a1f4d)',
    'linear-gradient(135deg,#0f2a4a,#1d5fae)',
    'linear-gradient(135deg,#ff7a3d,#b3271e)',
    'linear-gradient(135deg,#16563f,#3fae6f)',
    'linear-gradient(135deg,#1c1c1c,#444)',
    'linear-gradient(135deg,#4F8EFF,#7B5FFF)',
    'linear-gradient(135deg,#3a0f4d,#7B5FFF)',
    'linear-gradient(135deg,#0e3b3b,#1d9e9e)',
    'linear-gradient(135deg,#5c4a1c,#caa23f)',
    'linear-gradient(135deg,#1d1d3a,#5050a0)',
    'linear-gradient(135deg,#3a0e0e,#a03030)'
  ];
  var n = colors.length;
  var startAngle = -52, endAngle = 52;
  var radius = 360;
  var arc = document.getElementById('arc');
  for (var i = 0; i < n; i++) {
    var t = i / (n - 1);
    var angle = startAngle + t * (endAngle - startAngle);
    var rad = angle * Math.PI / 180;
    var x = Math.sin(rad) * radius;
    var y = radius - Math.cos(rad) * radius;
    var card = document.createElement('div');
    card.className = 'arc-card';
    card.style.background = colors[i];
    card.style.transform = 'translate(' + (x - 54) + 'px,' + y + 'px) rotate(' + angle + 'deg)';
    arc.appendChild(card);
  }
</script>

</body>
</html>
